name: pr10_git_antonyuk

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./GIT_PR10_antonyuk
      
    - name: Build
      run: dotnet build --no-restore
      working-directory: ./GIT_PR10_antonyuk
      
    - name: Run
      run: dotnet run --no-build
      working-directory: ./GIT_PR10_antonyuk
